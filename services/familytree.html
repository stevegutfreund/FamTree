      cur.forEach(x => (KIDS.get(x) || []).forEach(c => { if (!seen.has(c)) { seen.add(c); next.push(c); } }));
      if (!next.length) break;
      gens.push(next.length);
      cur = next;
    }
    return { gens, total: seen.size - 1 };
  }

    const { gens, total } = descStats(u);
    if (!total) return '';
    const tile = (v, l, cls = '') => `<div class="stat ${cls}"><b class="num">${v}</b><span>${l}</span></div>`;
    const note = gens.length > 3 ? `<div class="stat-note">לאורך ${gens.length} דורות${gens[3] ? ` · ${gens[3]} בני נינים` : ''}</div>` : '';
    return `<div class="sec"><h3>צאצאים</h3><div class="stat-grid">
      ${tile(gens[0] || 0, 'ילדים')}${tile(gens[1] || 0, 'נכדים')}${tile(gens[2] || 0, 'נינים')}${tile(total, 'סה״כ', 'total')}

  // ---------------- Search ----------------
  function searchPeople(q, limit = 8, exclude = null) {
    const forms = queryForms(q);
    if (!forms.length) return [];
    const out = [];
    M.forEach(m => {
      if (m.uuid === exclude) return;
      const nm = norm(m.name);
      let best = Infinity;
      forms.forEach((n, fi) => {
        const i = m.idx.indexOf(n);
        if (i < 0) return;
        // the query as typed outranks its other-keyboard reading
        const score = (nm.startsWith(n) ? 0 : (i === 0 || m.idx[i - 1] === ' ') ? 1 : 2) + (fi ? 0.5 : 0);
        best = Math.min(best, score);
      });
      if (best < Infinity) out.push([best, nm.length, m]);
    });
    return out.sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, limit).map(x => x[2]);
  }
  function resHTML(m, i, active) {
    const meta = parentsLine(m) || enName(m);
    return `<button class="res ${i === active ? 'on' : ''}" data-u="${m.uuid}" type="button">${avatar(m, 'sm')}<span style="min-width:0"><div class="nm">${esc(m.name)}</div>${meta ? `<div class="mt">${esc(meta)}</div>` : ''}</span><span class="yr num">${esc(years(m))}</span></button>`;
  }
  function bindCombo(input, box, onPick, { exclude = () => null, allowNew = false } = {}) {
    let items = [], active = 0;
    const draw = () => {
      const q = input.value;
      items = searchPeople(q, 8, exclude());
      if (!q.trim()) { box.hidden = true; return; }
      box.innerHTML = items.length ? items.map((m, i) => resHTML(m, i, active)).join('')
        : `<div class="res-empty">${allowNew ? `לא נמצא — ייווצר אדם חדש בשם "${esc(q.trim())}"` : 'לא נמצאו תוצאות'}</div>`;
      box.hidden = false;
    };
    input.addEventListener('input', () => { active = 0; draw(); });
    input.addEventListener('focus', () => { if (input.value.trim()) draw(); });
    input.addEventListener('keydown', e => {
      if (box.hidden) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(items.length - 1, active + 1); draw(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); draw(); }
      else if (e.key === 'Enter' && items[active]) { e.preventDefault(); box.hidden = true; onPick(items[active]); }
      else if (e.key === 'Escape') { box.hidden = true; }
    });
    box.addEventListener('mousedown', e => e.preventDefault());
    box.addEventListener('click', e => { const b = e.target.closest('[data-u]'); if (b) { box.hidden = true; onPick(M.get(b.dataset.u)); } });
    input.addEventListener('blur', () => setTimeout(() => (box.hidden = true), 120));
  }

        born: num('born'), passed: num('passed'),
        birthdate: txt('birthdate'), passedDate: txt('passedDate'),
        afterShkia: form.afterShkia.value === '' ? undefined : form.afterShkia.value === 'true',
        hebrewNickname: txt('hebrewNickname'), hebrewSurname: txt('hebrewSurname'),
        englishNickname: txt('englishNickname'), englishSurname: txt('englishSurname'),
        calendarName: txt('calendarName'),
        notes: mode === 'edit' ? form.notes.value.trim() : txt('notes'),
      };
      Object.keys(data).forEach(k => data[k] === undefined && delete data[k]);
      if (mode === 'add' && !data.gender) delete data.gender;
      if (mode === 'edit' && data.father === m.father) delete data.father;
      if (mode === 'edit' && data.mother === m.mother) delete data.mother;

      const btn = $('[type=submit]', form);
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>שומר…';
      try {
        let target = uuid;
        if (mode === 'edit') {
          await api('PUT', '/members/' + uuid, data);
        } else {
          target = await api('POST', '/members', data);
          if (rel === 'father' || rel === 'mother') await api('PUT', '/members/' + of, { [rel]: target });
        }
        close();
        await loadData();
        toast(mode === 'edit' ? 'השינויים נשמרו' : `${name} נוסף/ה לעץ`, 'ok');
        const next = rel && of ? of : target;
        if (typeof next === 'string' && M.has(next)) go(next, { push: next !== S.focus });
        else renderTree();
        if (S.view === 'people') renderPeople();
      } catch (err) {
        console.error(err);
        toast('השמירה נכשלה', 'err');
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i>נסה שוב';
      }
    });
  }

  async function api(method, path, body) {
    const r = await fetch(API + path, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(method + ' ' + path + ' → ' + r.status + ' ' + await r.text());
    const t = await r.text();
    try { return JSON.parse(t); } catch { return t; }
  }

  function toast(msg, type = '') {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.innerHTML = `<i class="fas ${type === 'err' ? 'fa-circle-exclamation' : type === 'ok' ? 'fa-circle-check' : 'fa-circle-info'}"></i>${esc(msg)}`;
    $('#toasts').appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2600);
  }

  // ---------------- Boot ----------------
  function defaultFocus() {
    // the person with the richest close family (2 generations each way)
    let best = null, bestScore = -1;
    M.forEach((m, u) => {
      const kids = KIDS.get(u) || [];
      const grand = kids.flatMap(c => KIDS.get(c) || []);
      const ps = [m.father, m.mother].filter(Boolean);
      const gps = ps.flatMap(p => [M.get(p).father, M.get(p).mother].filter(Boolean));
      const score = kids.length + grand.length + ps.length * 2 + gps.length * 2 + (m.birthdate ? 3 : 0);
      if (score > bestScore) { bestScore = score; best = u; }
    });
    return best;
  }

  (async function boot() {
    try {
      await loadData();
    } catch (e) {
      $('#loading').innerHTML = '<span><i class="fas fa-triangle-exclamation"></i>&nbsp; לא ניתן לטעון את הנתונים</span>';
      return;
    }
    $('#loading').remove();
    const fromHash = (location.hash.match(/p=([\w-]+)/) || [])[1];
    const start = [fromHash, store.get('focus', null)].find(u => u && M.has(u)) || defaultFocus();
    if (!start) { $('#stage').insertAdjacentHTML('beforeend', '<div class="loading">אין עדיין אנשים — הוסיפו את הראשון</div>'); return; }
    history.replaceState(null, '', '#p=' + start);
    S.focus = start;
    S.recent = [start, ...S.recent.filter(x => x !== start)].slice(0, 8);
    renderTree(false);
    frame(false);
    renderPanel();
    renderTrail();
  })();
</script>
</body>
